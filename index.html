const normalize=(s,lang)=>lang==='fa'?s.replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u064B-\u065F\u0670\u0640]/g,''):s.toLowerCase();
const alphabet={fa:Array.from('آابپتثجچحخدذرزژسشصضطظعغفقکگلمنوهیئ'),en:Array.from('abcdefghijklmnopqrstuvwxyz')};
const rows={fa:['ض ص ث ق ف غ ع ه خ ح ج چ','ش س ی ب ل ا ت ن م ک گ','ظ ط ز ر ذ د ئ و پ ژ آ'],en:['qwertyuiop','asdfghjkl','zxcvbnm']};
const S={lang:'fa',screen:'language',mode:null,stage:0,unlocked:0,best:Array(30).fill(null),used:new Set(),word:null,chosen:new Set(),removed:new Set(),mistakes:0,scan:false,filter:false,ended:false,transition:false,remaining:120000,lastTick:0,paused:false,session:0,queue:[],urgent:false,stats:null};
let moodTimer,toastTimer,animationFrame,transitionTimer,countdownTimer,modalReturnFocus,lastFocus,viewId=0,lastPersistedSecond=-1;

const SAVE_KEY='word-guess-session-v2';let restoring=false;
function saveSession(){if(restoring)return;try{const data={lang:S.lang,screen:S.screen,mode:S.mode,stage:S.stage,unlocked:S.unlocked,best:S.best,used:[...S.used],word:S.word,chosen:[...S.chosen],removed:[...S.removed],mistakes:S.mistakes,scan:S.scan,filter:S.filter,ended:S.ended,transition:S.transition,remaining:S.remaining,paused:S.paused,queue:S.queue,urgent:S.urgent,stats:S.stats};sessionStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch{}}
function clearSession(){try{sessionStorage.removeItem(SAVE_KEY);}catch{}}
function restoreSession(){try{const raw=sessionStorage.getItem(SAVE_KEY);if(!raw)return false;const d=JSON.parse(raw);if(!d||!['fa','en'].includes(d.lang)||!Array.isArray(d.best)||d.best.length!==30)return false;restoring=true;Object.assign(S,d);S.used=new Set(d.used||[]);S.chosen=new Set(d.chosen||[]);S.removed=new Set(d.removed||[]);S.paused=true;S.transition=false;S.ended=!!d.ended;S.stats=d.stats||makeStats();language(S.lang);if(S.screen==='game'&&S.word){S.lastTick=performance.now();if(S.ended){if(S.mode==='journey'){renderGame();stageResult(solved(),solved()?wordScore():0);}else{S.ended=false;S.transition=false;beginWord(timedWord());startClock();}}else{renderGame();showModal(`<div class="result-icon">⏸</div><h2 id="modalTitle">${t('restoredTitle')}</h2><p>${t('restoredText')}</p><div class="modal-actions">${button(t('resume'),'resume')}</div>`,false);}}else if(S.screen==='map')renderMap();else renderModes();restoring=false;saveSession();return true;}catch{restoring=false;clearSession();return false;}}

const t=k=>TEXT[S.lang][k]||k;
const num=n=>Number(n).toLocaleString(S.lang==='fa'?'fa-IR':'en-US');
const difficulty=d=>t(['easy','medium','hard'][d]);
const robotHTML=()=>$('#robotTemplate').innerHTML;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(text,action,cls='primary')=>`<button class="${cls}" data-action="${action}">${text}</button>`;
const stat=(value,label)=>`<div class="result-stat"><b>${value}</b><small>${label}</small></div>`;
function language(lang){S.lang=lang;document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';$('#brandText').textContent=t('brand');document.title=t('brand')+' · Nova';updateAudioButtons();}
function setScreen(screen){viewId++;S.screen=screen;$('#pauseBtn').hidden=screen!=='game';closeModal();clearTimeout(moodTimer);app.setAttribute('aria-label',t('brand'));window.scrollTo(0,0);saveSession();}
function renderLanguage(){stopRun();setScreen('language');app.innerHTML=`<section class="hero"><div class="hero-copy"><span class="eyebrow">WORD GUESS / حدس کلمه</span><h1>جهان را با <em>واژه‌ها</em><br>روشن کن.</h1><p dir="auto">یک هم‌سفر کوچک، یک جهان بزرگ.<br><span dir="ltr">A little companion. A universe to discover.</span></p><div class="language-buttons"><button class="primary" data-action="lang-fa">فارسی <span>←</span></button><button class="secondary" data-action="lang-en" lang="en" dir="ltr">English <span>→</span></button></div></div><div class="hero-art">${robotHTML()}<div class="floating-tag tag1">✦ <b>NOVA</b> / نُووا</div><div class="floating-tag tag2">SYSTEM READY <b>●</b></div></div></section>`;mood('wave',2000);}
function renderModes(){S.paused=false;setScreen('modes');app.innerHTML=`<div class="section-head"><div><span class="eyebrow">CHOOSE YOUR ORBIT</span><h2>${t('choose')}</h2><p>${t('chooseSub')}</p></div><button class="back-link" data-action="language">${t('language')}</button></div><div class="mode-grid"><button class="mode-card" data-action="journey"><span class="mode-icon">◉</span><h3>${t('journey')}</h3><p>${t('journeyDesc')}</p><div class="mode-footer"><span>${t('stages')}</span><span>↗</span></div></button><button class="mode-card timed" data-action="timed"><span class="mode-icon">◷</span><h3>${t('timed')}</h3><p>${t('timedDesc')}</p><div class="mode-footer"><span>${t('seconds')}</span><span>↗</span></div></button></div><div class="rules-inline"><button class="back-link" data-action="rules">${t('rules')} ↗</button></div><div class="footer-sign">CRAFTED FOR CURIOUS MINDS · NOVA FLIGHT SYSTEMS</div>`;}
function journeyTotal(){return S.best.reduce((a,b)=>a+(b?.score||0),0);}
function journeyStars(){return S.best.reduce((a,b)=>a+(b?.stars||0),0);}
function renderMap(){S.mode='journey';setScreen('map');app.innerHTML=`<div class="section-head"><div><span class="eyebrow">THE EXPEDITION</span><h2>${t('map')}</h2><p>${t('mapSub')}</p></div><button class="back-link" data-action="modes">${t('menu')}</button></div><div class="map-grid">${CATEGORIES[S.lang].map((c,i)=>`<section class="planet-card planet-${i+1}"><div class="planet-orb"></div><h3>${c.label}</h3><div class="stage-dots">${Array.from({length:6},(_,j)=>{const index=i*6+j,b=S.best[index];return `<button class="stage-dot ${b?'done':''} ${index===S.unlocked?'current':''}" data-stage="${index}" ${index>S.unlocked?'disabled':''} aria-label="${t('stage')} ${num(index+1)}${b?', '+num(b.stars)+' '+t('stars'):''}">${b?'✦':num(index+1)}${b?`<small>${'★'.repeat(b.stars)}</small>`:''}</button>`}).join('')}</div></section>`).join('')}</div><div class="map-footer"><div class="score-pill">✧ ${t('total')}: ${num(journeyTotal())} &nbsp; · &nbsp; ★ ${num(journeyStars())} / ${num(90)}</div>${button(t('newTravel'),'new-journey','secondary')}</div>`;}
function makeStats(){return {solved:0,score:0,skipped:0,failed:0,correct:0,wrong:0,scans:0,filters:0};}
function resetJourney(){S.best=Array(30).fill(null);S.unlocked=0;S.stage=0;S.used=new Set();S.stats=makeStats();saveSession();}
function pickWord(category,level){let pool=WORDS[S.lang].filter(w=>(!category||w.category===category)&&(level===undefined||w.difficulty===level));let fresh=pool.filter(w=>!S.used.has(w.answer));if(!fresh.length){pool.forEach(w=>S.used.delete(w.answer));fresh=pool.filter(w=>w.answer!==S.word?.answer);if(!fresh.length)fresh=pool;}const w=fresh[Math.floor(Math.random()*fresh.length)];if(!w)throw Error('Empty word bank');S.used.add(w.answer);return w;}
function timedWord(){if(!S.queue.length)S.queue=shuffle([0,0,1,1,2]);return pickWord(null,S.queue.pop());}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function beginWord(word){S.word=word;S.chosen=new Set();S.removed=new Set();S.mistakes=0;S.scan=false;S.filter=false;S.ended=false;S.transition=false;S.paused=false;S.lastTick=performance.now();renderGame();mood('wave',900);saveSession();}
function startStage(index){cancelAsync();S.mode='journey';S.stage=index;if(!S.stats)S.stats=makeStats();const category=CATEGORIES[S.lang][Math.floor(index/6)].id;beginWord(pickWord(category,Math.floor((index%6)/2)));saveSession();}
function timedIntro(){showModal(`<div class="result-icon">◷</div><h2 id="modalTitle">${t('ready')}</h2><p>${t('timedRules')}</p><p>${t('fullHelp')}</p><div class="modal-actions">${button(t('launch'),'launch')}${button(t('back'),'close','secondary')}</div>`);}
function startTimed(){stopRun();S.mode='timed';S.remaining=120000;S.queue=[];S.used=new Set();S.stats=makeStats();S.urgent=false;S.paused=true;setScreen('countdown');app.innerHTML=`<section class="result-screen"><div class="eyebrow">TIME CHALLENGE</div><h2>${t('ready')}</h2><div class="countdown" id="countdown">3</div><p>${t('timedRules')}</p></section>`;let count=3;audio.tone(440,.1);saveSession();const session=S.session;countdownTimer=setInterval(()=>{if(session!==S.session)return;count--;if(count){$('#countdown').textContent=num(count);audio.tone(440+count*80,.1);}else{clearInterval(countdownTimer);countdownTimer=null;beginWord(timedWord());audio.tone(880,.22);startClock();}},1000);}
function renderGame(){setScreen('game');const timed=S.mode==='timed';const cat=CATEGORIES[S.lang].find(c=>c.id===S.word.category);app.innerHTML=`<div class="game-top"><div class="mission-label">${timed?'VELOCITY RUN · 02':'PLANET EXPEDITION · 01'}<strong>${timed?t('timed'):t('stage')+' '+num(S.stage+1)+' / '+num(30)}</strong></div><div class="game-stats">${timed?`<div class="stat-chip"><small>${t('solved')}</small><b id="solvedCount">${num(S.stats.solved)}</b></div><div class="stat-chip timer" id="timerChip"><small>${t('time')}</small><b id="timerText">${formatTime(S.remaining)}</b></div>`:`<div class="stat-chip"><small>${t('total')}</small><b>${num(journeyTotal())}</b></div>`}</div></div><div class="game-grid"><section class="scene-panel planet-scene-${Math.floor(S.stage/6)+1}" aria-label="Nova"><div class="scene-label"><span>NOVA / CO-PILOT</span><span>● ONLINE</span></div>${robotHTML()}<div class="speech" id="speech" aria-live="polite">${t('hello')}</div><div class="progress-track" role="progressbar" aria-label="${t('progress')}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill"></div><span class="ship-marker">➤</span><div class="destination"></div></div></section><section class="play-panel"><div class="word-meta"><span class="category-badge">✦ ${cat.label}</span><span class="difficulty">${t('difficultyLabel')}: ${difficulty(S.word.difficulty)} ${[0,1,2].map(i=>`<i class="${i<=S.word.difficulty?'on':''}"></i>`).join('')}</span></div><div class="energy-row"><span id="energyLabel">${t('energy')} · ${num(6)} / ${num(6)}</span><div class="cells" aria-hidden="true">${'<i class="cell"></i>'.repeat(6)}</div></div><div id="word" class="word" dir="${S.lang==='fa'?'rtl':'ltr'}" aria-label="${num(Array.from(S.word.answer).filter(isLetter).length)} ${t('hiddenLetter')}"></div><div class="tools"><button class="tool" id="scanBtn" data-action="scan" title="${t('scan')}"><span>⌾</span>${t('scan')} <small>×1</small></button><button class="tool" id="filterBtn" data-action="filter" title="${t('filter')}"><span>⎇</span>${t('filter')} <small>×1</small></button></div><div class="keyboard" aria-label="${S.lang==='fa'?'صفحه‌کلید حروف':'Letter keyboard'}">${rows[S.lang].map(row=>`<div class="key-row">${(S.lang==='fa'?row.split(' '):Array.from(row)).map(c=>`<button class="key" data-letter="${c}" aria-label="${c}">${S.lang==='en'?c.toUpperCase():c}</button>`).join('')}</div>`).join('')}</div><p class="keyboard-note">${t('keyboard')}</p>${timed?`<div class="skip-row"><button class="skip-button" data-action="skip">${t('skip')} <span>${t('penalty')}</span> ↗</button></div>`:''}</section></div>`;updateBoard();}
function isLetter(c){return alphabet[S.lang].includes(normalize(c,S.lang));}
function hiddenLetters(){return [...new Set(Array.from(normalize(S.word.answer,S.lang)).filter(c=>isLetter(c)&&!S.chosen.has(c)))];}
function solved(){return hiddenLetters().length===0;}
function updateBoard(revealAll=false){const word=$('#word');if(!word)return;const chars=Array.from(normalize(S.word.answer,S.lang));const groups=[];let group=[];for(const c of chars){if(/[\s\u200c-]/.test(c)){if(group.length){groups.push(`<span class="word-group">${group.join('')}</span>`);group=[];}groups.push(`<span class="separator" aria-hidden="true">${c==='-'?'−':''}</span>`);}else{const shown=S.chosen.has(c)||!isLetter(c),visible=shown||revealAll;group.push(`<span class="letter ${shown?'revealed':revealAll?'answer':''}" aria-label="${visible?escapeHTML(c):t('hiddenLetter')}">${visible?escapeHTML(S.lang==='en'?c.toUpperCase():c):''}</span>`);}}if(group.length)groups.push(`<span class="word-group">${group.join('')}</span>`);word.innerHTML=groups.join('');
 const count=chars.filter(isLetter).length,found=chars.filter(c=>isLetter(c)&&S.chosen.has(c)).length,pct=count?Math.round(found/count*100):100;$('.progress-fill').style.width=pct+'%';$('.ship-marker').style.left=pct+'%';$('.progress-track').setAttribute('aria-valuenow',pct);
 document.querySelectorAll('.key').forEach(b=>{const c=b.dataset.letter;const used=S.chosen.has(c),correct=chars.includes(c);b.className='key'+(used?(correct?' correct':' wrong'):S.removed.has(c)?' eliminated':'');b.disabled=used||S.removed.has(c)||S.ended||S.paused||S.transition;b.setAttribute('aria-label',c+(used?' · '+t(correct?'letterCorrect':'letterWrong'):S.removed.has(c)?' · '+t('removed'):''));});
 document.querySelectorAll('.cell').forEach((c,i)=>c.classList.toggle('empty',i>=6-S.mistakes));$('#energyLabel').textContent=t('energy')+' · '+num(6-S.mistakes)+' / '+num(6);$('#scanBtn').disabled=S.scan||S.ended||S.paused||S.transition||!hiddenLetters().length;$('#filterBtn').disabled=S.filter||S.ended||S.paused||S.transition||!filterCandidates().length;const skip=$('[data-action="skip"]');if(skip)skip.disabled=S.ended||S.paused||S.transition;saveSession();}
function filterCandidates(){const chars=normalize(S.word.answer,S.lang);return alphabet[S.lang].filter(c=>!chars.includes(c)&&!S.chosen.has(c)&&!S.removed.has(c));}
function canAct(){return S.screen==='game'&&!S.ended&&!S.paused&&!S.transition&&$('#modal').hidden;}
function guess(raw){if(!canAct())return;if(S.mode==='timed'){syncTime();if(S.remaining<=0)return;}const c=normalize(raw,S.lang);if(!isLetter(c)||S.chosen.has(c)||S.removed.has(c))return;S.chosen.add(c);const count=Array.from(normalize(S.word.answer,S.lang)).filter(x=>x===c).length;if(count){S.stats.correct++;audio.play('correct');say(count>1?'multi':'correct');mood(count>1?'celebrate':S.stats.correct===1?'curious':'happy',count>1?1500:1000);}else{S.mistakes++;S.stats.wrong++;audio.play('wrong');say(S.mistakes===5?'focus':'wrong');mood(S.mistakes===5?'focus':'think',1400);}updateBoard();$('#announcer').textContent=c+' · '+t(count?'letterCorrect':'letterWrong')+' · '+num(6-S.mistakes)+' '+t('energy');checkEnd();}
function useTool(type){if(!canAct())return;if(S.mode==='timed'){syncTime();if(S.remaining<=0)return;}if(type==='scan'){if(S.scan)return;const letters=hiddenLetters();if(!letters.length)return;S.scan=true;S.stats.scans++;S.chosen.add(letters[Math.floor(Math.random()*letters.length)]);say('scanMsg');}else{if(S.filter)return;const letters=shuffle(filterCandidates()).slice(0,3);if(!letters.length)return;S.filter=true;S.stats.filters++;letters.forEach(c=>S.removed.add(c));say('filterMsg');}audio.play('scan');mood('scan',1400);updateBoard();checkEnd();}
function checkEnd(){if(solved())finishWord('win');else if(S.mistakes>=6)finishWord('lose');else if(S.mistakes===4){say('encourage');mood('focus',1500);}}
function wordScore(){return [100,150,200][S.word.difficulty]+(6-S.mistakes)*10+(!S.scan&&!S.filter?30:0);}
function wordStars(){if(S.mistakes<=1&&!S.scan&&!S.filter)return 3;if(S.mistakes<=2&&Number(S.scan)+Number(S.filter)<=1)return 2;return 1;}
function finishWord(outcome){if(S.ended)return;if(S.mode==='timed'){syncTime();if(S.remaining<=0)return;}S.ended=true;const win=outcome==='win';const score=win?wordScore():0;if(win){S.stats.solved++;S.stats.score+=score;}else if(outcome==='skip')S.stats.skipped++;else S.stats.failed++;audio.play(win?'win':'wrong');say(win?'winMsg':'loseMsg');mood(win?'win':'sad',S.mode==='timed'?1100:3000);updateBoard(true);

 else{if(win){const best=S.best[S.stage];const stars=wordStars();S.best[S.stage]={score:Math.max(best?.score||0,score),stars:Math.max(best?.stars||0,stars)};S.unlocked=Math.min(29,Math.max(S.unlocked,S.stage+1));confetti(30);saveSession();}const session=S.session;transitionTimer=setTimeout(()=>{if(session!==S.session)return;stageResult(win,score);},650);}}
function stageResult(win,score){const stars=win?wordStars():0;showModal(`<div class="result-icon">${win?'✦':'◈'}</div><h2 id="modalTitle">${t(win?'won':'lost')}</h2><small class="mission-label">${t('answer')}</small><div class="result-word" dir="${S.lang==='fa'?'rtl':'ltr'}">${escapeHTML(S.lang==='en'?S.word.answer.toUpperCase():S.word.answer)}</div>${win?`<div class="result-stars" aria-label="${num(stars)} ${t('stars')}">${'★'.repeat(stars)}<span style="opacity:.18">${'★'.repeat(3-stars)}</span></div>`:''}<div class="result-stats">${stat(num(score),t('score'))}${stat(num(S.mistakes),t('mistakes'))}${stat(num(Number(S.scan)+Number(S.filter)),t('tools'))}${stat(num(S.stage+1)+'/ '+num(30),t('stage'))}</div><div class="modal-actions">${win?button(t(S.stage===29?'finish':'next'),S.stage===29?'complete':'next'):button(t('retry'),'retry')}${button(t('mapBack'),'map','secondary')}</div>`,false);}
function formatTime(ms){const sec=Math.max(0,Math.ceil(ms/1000));return num(Math.floor(sec/60))+':'+String(sec%60).padStart(2,'0').replace(/\d/g,d=>S.lang==='fa'?'۰۱۲۳۴۵۶۷۸۹'[d]:d);}
function syncTime(){const now=performance.now();if(S.mode==='timed'&&S.screen==='game'&&!S.paused&&!S.transition&&!S.ended)S.remaining=Math.max(0,S.remaining-(now-S.lastTick));S.lastTick=now;if(S.mode==='timed'&&S.screen==='game'&&S.remaining<=0&&!S.transition)finishTimed();}
function updateClock(){const b=$('#timerText');if(b)b.textContent=formatTime(S.remaining);$('#timerChip')?.classList.toggle('urgent',S.remaining<=15000);if(S.remaining<=15000&&!S.urgent&&S.screen==='game'){S.urgent=true;say('urgent');mood('focus',1700);audio.play('warning');}if(S.mode==='timed'){const second=Math.ceil(S.remaining/1000);if(second!==lastPersistedSecond){lastPersistedSecond=second;saveSession();}}}
function startClock(){cancelAnimationFrame(animationFrame);const frame=()=>{if(S.mode!=='timed'||S.screen!=='game')return;syncTime();updateClock();if(S.screen==='game')animationFrame=requestAnimationFrame(frame);};S.lastTick=performance.now();animationFrame=requestAnimationFrame(frame);}
function finishTimed(){if(S.screen!=='game')return;S.ended=true;S.transition=false;clearTimeout(transitionTimer);cancelAnimationFrame(animationFrame);const answer=S.word.answer;setScreen('timed-result');audio.play('finish');const st=S.stats,accuracy=st.correct+st.wrong?Math.round(st.correct/(st.correct+st.wrong)*100):0;app.innerHTML=`<section class="result-screen"><span class="eyebrow">MISSION REPORT</span>${robotHTML()}<h1>${t('timedEnd')}</h1><p>${t('timedSub')}</p><p>${t('answer')}: <strong class="result-word">${escapeHTML(answer)}</strong></p><div class="result-stats">${stat(num(st.solved),t('solved'))}${stat(num(st.score),t('score'))}${stat(num(accuracy)+'٪',t('accuracy'))}${stat(num(st.skipped),t('skipped'))}${stat(num(st.failed),t('failed'))}${stat(num(st.correct)+' / '+num(st.wrong),t('guesses'))}${stat(num(st.scans),t('scans'))}${stat(num(st.filters),t('filters'))}</div><div class="modal-actions">${button(t('playAgain'),'launch')}${button(t('menu'),'modes','secondary')}</div></section>`;mood('happy',3000);}
function completeJourney(){setScreen('complete');confetti(60);app.innerHTML=`<section class="result-screen"><span class="eyebrow">EXPEDITION COMPLETE</span>${robotHTML()}<h1>${t('complete')}</h1><p>${t('completeSub')}</p><div class="result-stats">${stat(num(journeyTotal()),t('total'))}${stat(num(journeyStars())+' / '+num(90),t('stars'))}${stat(num(S.best.filter(Boolean).length),t('stages').split('·')[0])}</div><div class="modal-actions">${button(t('newTravel'),'new-journey')}${button(t('map'),'map','secondary')}${button(t('menu'),'modes','secondary')}</div></section>`;mood('win',7000);}
function mood(name,duration=1200){clearTimeout(moodTimer);document.querySelectorAll('.robot').forEach(r=>r.dataset.mood=name);const id=viewId;moodTimer=setTimeout(()=>{if(id!==viewId)return;document.querySelectorAll('.robot').forEach(r=>r.dataset.mood='idle');},duration);}
function say(key){const el=$('#speech');if(el){el.textContent=t(key);el.classList.remove('speech-pop');void el.offsetWidth;el.classList.add('speech-pop');}}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2400);}
function cancelAsync(){S.session++;clearTimeout(transitionTimer);clearInterval(countdownTimer);cancelAnimationFrame(animationFrame);transitionTimer=null;countdownTimer=null;}
function stopRun(){cancelAsync();S.paused=false;S.transition=false;}
function showModal(html,dismissible=true){modalReturnFocus=document.activeElement;$('#modalCard').innerHTML=html;$('#modal').hidden=false;$('#modal').dataset.dismissible=String(dismissible);app.inert=true;document.querySelector('header').inert=true;requestAnimationFrame(()=>$('#modalCard button')?.focus());}
function closeModal(){const wasOpen=!$('#modal').hidden;$('#modal').hidden=true;app.inert=false;document.querySelector('header').inert=false;if(wasOpen&&modalReturnFocus?.isConnected)modalReturnFocus.focus();}
function pause(){if(S.screen!=='game'||S.ended||S.transition||S.paused)return;syncTime();if(S.screen!=='game')return;S.paused=true;updateBoard();renderPause();saveSession();}
function renderPause(){showModal(`<div class="result-icon">Ⅱ</div><h2 id="modalTitle">${t('paused')}</h2><p>${t('pauseText')}</p><div class="modal-actions">${button(t('resume'),'resume')}${button(t('rules'),'rules','secondary')}${button(t('restart'),'restart','secondary')}${button(t('menu'),'exit-game','secondary')}${button((audio.music?'✓ ':'')+t('music'),'modal-music','secondary')}${button((audio.effects?'✓ ':'')+t('sound'),'modal-sound','secondary')}</div>`);}
function resume(){closeModal();S.paused=false;S.lastTick=performance.now();updateBoard();saveSession();if(S.mode==='timed')startClock();}
function rulesModal(){const inPause=S.screen==='game'&&S.paused;showModal(`<h2 id="modalTitle">${t('rulesTitle')}</h2><ul class="help-list">${TEXT[S.lang].rulesItems.map(x=>`<li>${x}</li>`).join('')}</ul><div class="modal-actions">${button(t('back'),inPause?'pause-back':'close')}</div>`);}
function confirmAction(action){const inGame=S.screen==='game';if(inGame&&!S.paused)pause();showModal(`<h2 id="modalTitle">${t('changeTitle')}</h2><p>${t('changeText')}</p><div class="modal-actions">${button(t('confirm'),'confirm-'+action,'danger')}${button(t('cancel'),inGame?'pause-back':'cancel-map','secondary')}</div>`);}
function updateAudioButtons(){for(const [id,on,key] of [['soundBtn',audio.effects,'sound'],['musicBtn',audio.music,'music']]){const b=$('#'+id);b.classList.toggle('off',!on);b.setAttribute('aria-label',t(key));b.setAttribute('aria-pressed',String(on));b.title=t(key);}$('#pauseBtn').setAttribute('aria-label',t('pause'));}
const audio={ctx:null,effects:true,music:false,musicTimer:null,notes:0,init(){try{if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});}catch{}},tone(freq,dur=.12,type='sine',volume=.06,force=false){if((!this.effects&&!force)||!this.ctx||document.hidden)return;const ctx=this.ctx,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(volume,ctx.currentTime+.018);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur+.03);},play(kind){const sounds={correct:[660,880,1175],wrong:[220,174],scan:[420,630,840,1260],win:[523,659,784,1047,1318],warning:[392,440,392],finish:[784,659,523,392],click:[520]};(sounds[kind]||[600]).forEach((f,i)=>setTimeout(()=>{this.tone(f,.18,kind==='wrong'?'triangle':'sine',kind==='wrong'?.035:.04);if(kind==='scan')this.tone(f*1.5,.12,'triangle',.012);},i*(kind==='win'?95:65)));},toggleMusic(){this.music=!this.music;clearInterval(this.musicTimer);if(this.music){this.init();const notes=[130.81,164.81,196,261.63,220,196,164.81,146.83];const play=()=>{if(!this.music||document.hidden)return;const f=notes[this.notes++%notes.length];this.tone(f,2.8,'sine',.012,true);this.tone(f*2,1.8,'triangle',.004,true);};play();this.musicTimer=setInterval(play,2600);}updateAudioButtons();}};
function dispatch(action){audio.init();switch(action){case'lang-fa':case'lang-en':{const next=action.slice(5);if(S.lang!==next&&(S.best.some(Boolean)||S.word)){S.pendingLang=next;showModal(`<h2 id="modalTitle">${t('language')}</h2><p>${t('languageWarning')}</p><div class="modal-actions">${button(t('confirm'),'confirm-language','danger')}${button(t('cancel'),'close','secondary')}</div>`);}else{S.lang=next;clearSession();resetJourney();language(next);renderModes();saveSession();}break;}case'language':renderLanguage();break;case'modes':stopRun();renderModes();break;case'journey':S.mode='journey';if(!S.stats)S.stats=makeStats();renderMap();break;case'timed':timedIntro();break;case'launch':startTimed();break;case'scan':useTool('scan');break;case'filter':useTool('filter');break;case'skip':if(canAct())finishWord('skip');break;case'next':startStage(S.stage+1);break;case'retry':startStage(S.stage);break;case'map':cancelAsync();renderMap();break;case'complete':completeJourney();break;case'pause':pause();break;case'resume':resume();break;case'pause-back':renderPause();break;case'close':closeModal();break;case'rules':rulesModal();break;case'restart':confirmAction('restart');break;case'exit-game':confirmAction('exit');break;case'new-journey':if(S.best.some(Boolean))confirmAction('new');else{resetJourney();startStage(0);}break;case'cancel-map':closeModal();break;case'confirm-restart':if(S.mode==='timed')startTimed();else{stopRun();resetJourney();startStage(0);}break;case'confirm-exit':stopRun();renderModes();break;case'confirm-new':stopRun();resetJourney();startStage(0);break;case'confirm-language':{const next=S.pendingLang||'fa';stopRun();clearSession();S.lang=next;resetJourney();S.mode=null;S.word=null;language(next);renderModes();saveSession();break;}case'modal-music':audio.toggleMusic();renderPause();break;case'modal-sound':audio.effects=!audio.effects;updateAudioButtons();renderPause();break;}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.action){dispatch(b.dataset.action);return;}if(b.dataset.stage!==undefined){audio.init();startStage(Number(b.dataset.stage));}else if(b.dataset.letter){audio.init();guess(b.dataset.letter);}});
$('#pauseBtn').onclick=pause;$('#soundBtn').onclick=()=>{audio.init();audio.effects=!audio.effects;updateAudioButtons();};$('#musicBtn').onclick=()=>audio.toggleMusic();$('#brand').onclick=e=>{e.preventDefault();if(S.screen==='game'){pause();}else if(S.screen==='countdown'){stopRun();renderModes();}else if(S.screen!=='language'){stopRun();renderModes();}};
document.addEventListener('keydown',e=>{if(e.key==='Tab'&&!$('#modal').hidden){const buttons=[...$('#modal').querySelectorAll('button:not(:disabled)')];if(!buttons.length){e.preventDefault();return;}const first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}return;}if(e.key==='Escape'){e.preventDefault();if(S.screen==='game'){if(S.paused)resume();else pause();}else if(!$('#modal').hidden&&$('#modal').dataset.dismissible==='true')closeModal();return;}if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||!canAct()||e.key.length!==1)return;const c=normalize(e.key,S.lang);if(isLetter(c)){e.preventDefault();audio.init();guess(c);}else if(/[a-zA-Z\u0621-\u06cc]/.test(c)){toast(t('wrongKeyboard'));}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(S.screen==='game'&&!S.ended&&!S.transition){syncTime();pause();saveSession();}if(S.screen==='countdown'){stopRun();renderModes();}}else if(S.mode==='timed'&&S.screen==='game'&&!S.paused&&!S.ended){S.lastTick=performance.now();startClock();}});
function confetti(count){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const box=document.createElement('div');box.className='particles';const colors=['#65f5e0','#ad8bff','#ffd586','#fff'];for(let i=0;i<count;i++){const p=document.createElement('i');p.className='confetti';p.style.cssText=`left:${Math.random()*100}%;background:${colors[i%4]};animation-delay:${Math.random()*.5}s;animation-duration:${1.8+Math.random()*1.4}s;transform:rotate(${Math.random()*180}deg)`;box.append(p);}document.body.append(box);setTimeout(()=>box.remove(),4000);}
function starfield(){const canvas=$('#stars'),ctx=canvas.getContext('2d');if(!ctx)return;let stars=[],width=0,height=0,raf,last=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)');function resize(){width=innerWidth;height=innerHeight;const ratio=Math.min(devicePixelRatio||1,2);canvas.width=width*ratio;canvas.height=height*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);stars=Array.from({length:Math.min(160,Math.round(width*height/8000))},()=>({x:Math.random()*width,y:Math.random()*height,r:.4+Math.random()*1.2,a:.15+Math.random()*.6,p:Math.random()*6}));draw(0);}function draw(time){ctx.clearRect(0,0,width,height);for(const s of stars){ctx.globalAlpha=s.a*(reduced.matches?1:.7+.3*Math.sin(time/1800+s.p));ctx.fillStyle='#c4dcff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}function frame(time){if(document.hidden||reduced.matches){raf=null;return;}if(time-last>60){draw(time);last=time;}raf=requestAnimationFrame(frame);}addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!raf&&!reduced.matches)raf=requestAnimationFrame(frame);});resize();if(!reduced.matches)raf=requestAnimationFrame(frame);}
// Pure helpers are exposed for repeatable offline verification, not persistence.
window.GuessTest={normalize,wordScore,wordStars,alphabet,validateBanks(){const issues=[];for(const lang of ['fa','en']){const seen=new Set();for(const w of WORDS[lang]){const n=normalize(w.answer,lang);if(seen.has(n))issues.push(lang+': duplicate '+n);seen.add(n);if(!CATEGORIES[lang].some(c=>c.id===w.category))issues.push(lang+': category '+n);if(![0,1,2].includes(w.difficulty))issues.push(lang+': difficulty '+n);for(const c of n)if(!alphabet[lang].includes(c)&&!/[\s\u200c-]/.test(c))issues.push(lang+': invalid '+c+' in '+n);}}return issues;}};
language('fa');S.stats=makeStats();if(!restoreSession())renderLanguage();starfield();
